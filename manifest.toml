#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "waterheater"
name = "Water Heater"
description.en = "Dashboard for A. O. Smith iCOMM water heaters"

version = "1.3~ynh1"

maintainers = []

[upstream]
license = "NOASSERTION"
code = "https://github.com/moreno001-create/water-heater-server_ynh"

[integration]
yunohost = ">= 12.0.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "100M"
ram.build = "200M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/waterheater"

    [install.init_main_permission]
    help.en = "Anyone in this group can change the setpoint and mode. Do not choose visitors."
    type = "group"
    default = "admins"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8765

    [resources.apt]
    packages = "python3, python3-venv, python3-pip"
